name: SonarQube Cloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        working-directory: gestion_bib
        run: |
          mkdir -p out/production/gestion_bib
          javac -d out/production/gestion_bib src/*.java

      - name: Diagnose SonarCloud access
        run: python3 .github/sonar_access_check.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          projectBaseDir: gestion_bib
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
