name: SonarQube Cloud

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    env:
      SONAR_ANALYSIS_BRANCH: master
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        working-directory: gestion_bib
        run: |
          mkdir -p out/production/gestion_bib
          javac --release 17 -d out/production/gestion_bib src/*.java

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        with:
          projectBaseDir: gestion_bib
          args: >
            -Dsonar.scanner.skipJreProvisioning=true
            -Dsonar.branch.name=master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Capture analysis results for the lab report
        run: python3 .github/sonar_results.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
